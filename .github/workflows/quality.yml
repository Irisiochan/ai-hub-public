name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            mobile/package-lock.json

      - name: Verify third-party notices
        run: npm run notices:check

      - name: Install gateway, web, and mobile dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix mobile

      - name: Audit dependencies
        run: |
          npm audit --prefix server --audit-level=moderate
          npm audit --prefix web --audit-level=moderate
          npm audit --prefix mobile --audit-level=moderate

      - name: Test gateway, web, and worker
        run: |
          npm test --prefix server
          npm test --prefix web
          npm test --prefix worker

      - name: Build gateway and web
        run: npm run build

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install gateway, web, and desktop dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix desktop

      - name: Audit desktop dependencies
        run: |
          npm audit --prefix desktop --audit-level=moderate
          npm audit --prefix desktop --omit=dev --audit-level=moderate

      - name: Build desktop installers
        run: |
          npm run build
          npm run dist --prefix desktop

      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: ai-hub-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14

  memory-vault-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install contract client
        run: npm ci --prefix server

      - name: Verify pinned Memory Vault version
        run: npm run check:memory-version --prefix server

      - name: Start pinned Memory Vault
        run: |
          cp .env.example .env
          docker compose -f docker-compose.example.yml -f .github/compose.memory-contract.yml \
            up --build --wait -d memory-vault

      - name: Verify MCP contract
        env:
          VAULT_SMOKE_URL: http://127.0.0.1:18900/mcp
        run: npm run smoke:memory-contract --prefix server

      - name: Memory Vault logs
        if: always()
        run: docker compose -f docker-compose.example.yml -f .github/compose.memory-contract.yml logs memory-vault

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.example.yml -f .github/compose.memory-contract.yml down
