services:
  memory-vault:
    build:
      # Memory Vault is a versioned external dependency, not source copied into
      # this repository. Override only when intentionally testing a release.
      context: "https://github.com/Irisiochan/memory-vault.git#${MEMORY_VAULT_VERSION:-v0.7.1}"
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      MEMORY_VAULT_PATH: /vault
      VAULT_ALLOWED_HOSTS: "memory-vault:*"
      VAULT_GIT_SYNC: auto
    volumes:
      - ./vault-data:/vault
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8900),2); s.close()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-hub:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3900:3900"
    env_file:
      - .env
    depends_on:
      memory-vault:
        condition: service_healthy
    volumes:
      - ./server/config.docker.example.json:/app/server/config.json:ro
      - ai-hub-data:/app/server/data
      - ai-hub-agents:/app/server/agents
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3900/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ai-hub-data:
  ai-hub-agents:
